schema_version = "1.0.0"

id = "midi2ani"
version = "0.1.0"
name = "MIDI2Ani"
tagline = "Stream live MIDI notes and CCs from macOS IAC into scene props"
maintainer = "MIDI2Ani"
type = "add-on"
blender_version_min = "4.5.0"
license = ["SPDX:GPL-3.0-or-later"]
platforms = ["macos-arm64", "macos-x64"]

# Bundled wheels: cp311 = Blender 4.5 LTS, cp313 = Blender 5.2 LTS.
# python-rtmidi 1.5.8 has no cp313 wheel on PyPI, so the cp313 arm64 wheel was built locally:
#   MACOSX_DEPLOYMENT_TARGET=11.0 python3.13 -m pip wheel python-rtmidi==1.5.8 --no-deps --no-binary=python-rtmidi -w wheels/
# (no cp313 x64 wheel is bundled; build it on an Intel Mac.)
wheels = [
  "./wheels/mido-1.3.3-py3-none-any.whl",
  "./wheels/packaging-26.3-py3-none-any.whl",
  "./wheels/python_rtmidi-1.5.8-cp311-cp311-macosx_10_9_x86_64.whl",
  "./wheels/python_rtmidi-1.5.8-cp311-cp311-macosx_11_0_arm64.whl",
  "./wheels/python_rtmidi-1.5.8-cp313-cp313-macosx_11_0_arm64.whl",
]
